name: Build and Publish Release

on:
  push:
    tags:
      - "*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example 2.0.0-1.21.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: release_ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: chmod +x gradlew && bash gradlew build

      - name: Read project versions
        shell: bash
        run: |
          grep -E "^(minecraft_version|neo_version|mod_version)=" gradle.properties >> "$GITHUB_ENV"

      - name: Find release jar
        id: jar
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)"
          if [ -z "$jar_path" ]; then
            echo "No release jar found in build/libs" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Admin Logger ${mod_version}

          Minecraft: ${minecraft_version}
          NeoForge: ${neo_version}

          Built from tag: ${{ steps.release_ref.outputs.tag }}
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_ref.outputs.tag }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$JAR_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$JAR_PATH" --title "$TAG_NAME" --notes-file release-notes.md
          fi
