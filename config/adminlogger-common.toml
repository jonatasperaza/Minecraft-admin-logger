# Admin Logger common configuration example

[general]

# Mod language: en_us or pt_br
language = "pt_br"

# Directory where logs are stored. Relative paths use the server/game directory.
logDirectory = "logs/adminlogger"

# Maximum size in MB for each log file before archiving.
maxLogSizeMb = 5

# Log format: text or jsonl.
logFormat = "text"

# Also write every event to logs/adminlogger/_global.
logGlobalIndex = true

# Use player UUIDs instead of player names for per-player folders.
useUuidFolders = false

# Include the player UUID in text log lines.
includePlayerUuid = false

# Enable event categories.
logChat = true
logCommands = true
logInventory = false
logBlocks = true
logContainers = true
logItems = true
logGameMode = true
logTeleports = true

# Filters. Values are case-insensitive.
ignoredPlayers = []
ignoredWorlds = []
ignoredCommands = ["login", "register", "l", "reg"]

# Active alerts. Disabled by default.
enableAlerts = false
alertEventTypes = ["commands", "containers"]
watchedPlayers = []
watchedCommands = ["op", "deop", "ban", "pardon", "kick", "stop", "reload", "gamemode", "tp", "teleport"]
broadcastAlertsToOps = true
writeAlertLog = true

# Optional Discord webhook alerts. Keep the URL private.
discordWebhookEnabled = false
discordWebhookUrl = ""
discordWebhookUsername = "Admin Logger"

# Sensitive command masking.
maskSensitiveCommands = true
sensitiveCommandTerms = ["password", "passwd", "senha", "token", "secret", "key", "apikey", "api_key", "webhook"]
